<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:* http://localhost:*; media-src 'self' blob: data:; font-src 'self';" />
  <link rel="stylesheet" href="face.css" />
  <title>Okur</title>
</head>
<body>
  <!-- Arka plan tamamen suruklenebilir; etkilesimli ogeler no-drag -->
  <div id="app">
    <!-- Tutma cubugu: her zaman gorunur tasima alani -->
    <div id="grip" title="Tut ve taşı"><span></span><span></span><span></span></div>

    <!-- Baslik: maskot + kontroller (yatay, compact) -->
    <div id="header">
      <div id="stage">
        <div id="halo"></div>
        <div id="face" class="idle" title="Tıkla: oku / duraklat">
          <div id="ring"></div>
          <img id="faceImg" src="../assets/face.png" alt="" />
          <div id="fallbackFace">✨</div>
        </div>
        <div id="cueBadge"></div>
      </div>
      <div id="headRight">
        <div id="controls">
          <button id="btnToggle" class="ctl primary" title="Oku / Duraklat">
            <svg class="ic ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.87l11-6.8a1 1 0 0 0 0-1.74l-11-6.8A1 1 0 0 0 8 5.2Z"/></svg>
            <svg class="ic ic-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1.4"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.4"/></svg>
          </button>
          <button id="btnStop" class="ctl" title="Durdur">
            <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="3.2"/></svg>
          </button>
          <button id="btnMute" class="ctl" title="Sesi sustur / aç (bildirimler devam eder)">
            <svg class="ic ic-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            <svg class="ic ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16.5 9.5 5 5"/><path d="m21.5 9.5-5 5"/></svg>
          </button>
          <button id="btnSpeak" class="ctl" title="Metin okut">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5h15a1 1 0 0 1 1 1v8.5a1 1 0 0 1-1 1H9.5l-4 3.5v-3.5h-1a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/><path d="M10.5 8.6v4.3l3.8-2.15-3.8-2.15Z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="btnSettings" class="ctl" title="Ayarlar">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.05.05a2 2 0 1 1-2.83 2.83l-.05-.05a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 0 1-4 0v-.13a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 0 1 0-4h.13a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.05-.05a2 2 0 1 1 2.83-2.83l.05.05a1.7 1.7 0 0 0 1.87.34h.08A1.7 1.7 0 0 0 10 4.73V4a2 2 0 0 1 4 0v.13a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.05-.05a2 2 0 1 1 2.83 2.83l-.05.05a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 0 1 0 4h-.13a1.7 1.7 0 0 0-1.47 1.06Z"/></svg>
          </button>
        </div>
        <div id="nowReading"></div>
      </div>
    </div>

    <!-- Oturum bari: hangi sekme calisiyor / onay bekliyor / bitti -->
    <div id="sessions" class="sheet hidden">
      <div id="sessionList"></div>
    </div>

    <!-- Metin okut kutusu -->
    <div id="speakBox" class="sheet hidden">
      <textarea id="speakText" placeholder="Okumak istediğin metni buraya yapıştır…"></textarea>
      <div class="speak-actions">
        <button id="btnReadText" class="btn-soft">Oku</button>
        <button id="btnReadClip" class="btn-soft">Panoyu oku</button>
      </div>
      <div class="hint" id="hotkeyHint"></div>
    </div>

    <!-- Okunan metin: isikla aydinlatilmis son konum -->
    <div id="caption" class="sheet hidden">
      <div class="cap-head">
        <span>Okunan metin</span>
        <button id="btnCapClose" class="cap-close" title="Paneli kapat (okuma sürerse devam eder)">×</button>
      </div>
      <div id="lines"></div>
    </div>

    <!-- Ayarlar -->
    <div id="settings" class="sheet hidden">
      <div class="srow">
        <label>Motor</label>
        <select id="setEngine">
          <option value="auto">Otomatik</option>
          <option value="browser">Tarayıcı sesi</option>
          <option value="chatterbox">Ses sunucusu (doğal)</option>
        </select>
      </div>
      <div class="srow">
        <label>Ne okunsun</label>
        <select id="setScope">
          <option value="lastParagraph">Son paragraf (özet)</option>
          <option value="lastSentence">Son cümle</option>
          <option value="all">Tümü</option>
        </select>
      </div>
      <div class="srow">
        <label>Dil</label>
        <select id="setLang"></select>
      </div>
      <div class="srow">
        <label>Ses</label>
        <select id="setVoice"></select>
      </div>
      <div class="srow">
        <label>Hız</label>
        <input id="setRate" type="range" min="0.6" max="1.8" step="0.05" />
        <span id="rateVal" class="hint">1.0x</span>
      </div>
      <div class="srow check"><label><input id="setAutoRead" type="checkbox" /> Gelince otomatik SESLİ oku</label></div>
      <div class="srow check"><label><input id="setSkipCode" type="checkbox" /> Kod bloklarını atla</label></div>
      <div class="srow check"><label><input id="setCueFlash" type="checkbox" /> Bitince titresin</label></div>
      <div class="srow check"><label><input id="setReadOnCopy" type="checkbox" /> Kopyalayınca oku (seç → Ctrl+C)</label></div>
      <div class="srow">
        <label>Proje süzgeci</label>
        <input id="setFilter" type="text" placeholder="hepsi (boş bırak)" />
      </div>
      <div class="srow">
        <label>Kısayol</label>
        <input id="setHotkey" type="text" placeholder="CommandOrControl+Alt+S" />
      </div>
      <div class="srow foot">
        <span id="status" class="hint"></span>
        <button id="btnQuit" class="btn-soft danger">Çıkış</button>
      </div>
    </div>
  </div>
  <script src="face.js"></script>
</body>
</html>
